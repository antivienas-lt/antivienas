<div class="user-actions">
  <div class="info-block">
    <strong class="meeting-status" style="background-color: gainsboro;">ATŠAUKTA</strong>
    {% if request.user == meeting.user %}
    <p><span class="block-title">Deja, bet draugas negali susisitikti, todėl atmetė jūsų kvietimą.</span></p>
    {% else %}
    <p><span class="block-title">Jūs atšaukėte susitikimą.</span></p>
    {% endif %}
  </div>
  {% if meeting.declined_reason %}
  <br>
    <div class="info-block description">
      <span class="block-title">Atšaukimo priežąstis:</span>
      <p>{{meeting.declined_reason}}</p>
    </div>
  {% endif %}
</div>
