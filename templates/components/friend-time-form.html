</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    function timeToMinutes(t) {
        return t * 60;
    }

    function validateRow(fromSelect, toSelect) {
        const fromVal = fromSelect.value;
        const toVal = toSelect.value;

        // reset styles
        fromSelect.classList.remove("time-error");
        toSelect.classList.remove("time-error");

        if (!fromVal || !toVal) return;

        const fromMinutes = timeToMinutes(fromVal);
        const toMinutes = timeToMinutes(toVal);

        if(fromMinutes == 0 && toMinutes == 0){
          return;
        }

        if (fromMinutes >= toMinutes) {
            fromSelect.classList.add("time-error");
            toSelect.classList.add("time-error");
        }
    }

    // Find all rows with time inputs
    document.querySelectorAll("tr").forEach(row => {
        const fromSelect = row.querySelector(".time-from");
        const toSelect = row.querySelector(".time-to");

        if (fromSelect && toSelect) {
            // attach events
            fromSelect.addEventListener("change", () => validateRow(fromSelect, toSelect));
            toSelect.addEventListener("change", () => validateRow(fromSelect, toSelect));

            // validate initial state
            validateRow(fromSelect, toSelect);
        }
    });
});
</script>
