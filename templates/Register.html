{% extends "components/base.html"%}
{% load static %}

{% block meta %}
<title>Registracija</title>
<meta name="robots" content="index, nofollow">
<meta property="og:title" content="Registracija | antivienas.lt">
<meta property="og:image" content="https://antivienas.lt/static/assets/av_thumb_generic.png">
<meta property="og:url" content="https://antivienas.lt{% url 'register' %}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

      <div class="form-field-input">
        <label for="emailField">El. paštas</label>

        <input type="checkbox" name="is_of_age" id="Is_of_ageBox" value="true" {% if form.is_of_age.value %}checked{% endif %}>
        <label for="Is_of_ageBox">Sutinku, kad man yra 18+ metų.</label>
      </div>
      <div class="form-field-checkbox">
        <input type="checkbox" name="rules" id="RulesBox" value="true" {% if form.rules.value %}checked{% endif %}>
        <label for="RulesBox">Perskaičiau ir sutinku su <a href="{% url 'rules' %}">platformos taisyklėmis</a>.</label>
      </div>
      <div class="form-field-checkbox">
        <input type="checkbox" name="privacy" id="PrivacyBox" value="true" {% if form.privacy.value %}checked{% endif %}>
        <label for="PrivacyBox">Perskaičiau ir sutinku su <a href="{% url 'privacy-policy' %}">privatumo sąlygomis</a>.</label>
      </div>
      <button type="submit" class="login-btn">Registruotis</button>
    </form>
  </div>

  {% include "components/footer.html" %}

<script>
  const passwordField = document.getElementById("passwordField");
  const eyeClosed = document.getElementById("eyeClosed");
  const eyeOpened = document.getElementById("eyeOpened");

  function togglePasswordField(){
    if (passwordField.type === "text"){
      eyeClosed.style.display = "initial";
      eyeOpened.style.display = "none";
      passwordField.type = "password";
    } 
    else{
      eyeClosed.style.display = "none";
      eyeOpened.style.display = "initial";
      passwordField.type = "text"
    }
  }
  eyeClosed.addEventListener('click', () => togglePasswordField());
  eyeOpened.addEventListener('click', () => togglePasswordField());

</script>
</body>
{% endblock %}
